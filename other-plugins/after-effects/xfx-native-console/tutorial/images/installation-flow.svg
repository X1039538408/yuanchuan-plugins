<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="285" viewBox="0 0 1120 285"><rect width="1120" height="285" rx="14" fill="#edf2fc"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#202d4d"><text x="30" y="38" font-size="18" font-weight="700">下载安装流程示意</text><text x="30" y="66" font-size="14" fill="#566784">流程说明，不是 Windows 安装窗口截图</text><g fill="#fff" stroke="#c6d1e7"><rect x="30" y="95" width="230" height="130" rx="10"/><rect x="305" y="95" width="230" height="130" rx="10"/><rect x="580" y="95" width="230" height="130" rx="10"/><rect x="855" y="95" width="235" height="130" rx="10"/></g><g font-size="18" font-weight="700"><text x="48" y="128">1 下载 EXE</text><text x="323" y="128">2 保存工程并退出 AE</text><text x="598" y="128">3 运行并允许安装</text><text x="873" y="128">4 重开 AE</text></g><g font-size="14" fill="#566784"><text x="48" y="163">GitHub 点击下载链接</text><text x="48" y="191">取得 1.0.18 安装器</text><text x="323" y="163">确认所有 AE 已退出</text><text x="323" y="191">避免未保存工程丢失</text><text x="598" y="163">Windows 管理员权限</text><text x="598" y="191">查看安装结果和目录</text><text x="873" y="163">Ctrl + 空格呼出</text><text x="873" y="191">旧配置保留自定义按键</text></g><g stroke="#385fba" stroke-width="2" fill="none"><path d="M270 160h23m-7-7 7 7-7 7"/><path d="M545 160h23m-7-7 7 7-7 7"/><path d="M820 160h23m-7-7 7 7-7 7"/></g><text x="30" y="258" font-size="13" fill="#566784">AE 仍运行时只提示保存退出，不会结束 AE；完成第 2 步后再安装。</text></g></svg>
