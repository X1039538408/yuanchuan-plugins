<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="250" viewBox="0 0 1080 250"><rect width="1080" height="250" rx="12" fill="#edf2fc"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#202d4d"><text x="28" y="35" font-size="18" font-weight="700">效果控制台：一键卸载流程示意</text><text x="28" y="62" font-size="14">不是 Windows 实机截图；卸载不会结束 AE，也不删除个人设置或图片</text><g fill="#fff" stroke="#c6d1e7"><rect x="28" y="88" width="310" height="125" rx="9"/><rect x="385" y="88" width="310" height="125" rx="9"/><rect x="742" y="88" width="310" height="125" rx="9"/></g><g font-size="19" font-weight="700"><text x="48" y="125">1 保存工程并退出 AE</text><text x="405" y="125">2 运行卸载器并确认</text><text x="762" y="125">3 重开 AE 检查</text></g><g font-size="14"><text x="48" y="160">如果 AE 仍运行，只提示，不关闭</text><text x="405" y="160">核对 AE 目录，确认移除插件</text><text x="762" y="160">菜单入口消失，个人数据保留</text><text x="48" y="185">退出后重新运行卸载器</text><text x="405" y="185">只处理固定的五种文件</text><text x="762" y="185">如需重装，运行新版安装器</text></g><g stroke="#3158af" stroke-width="2" fill="none"><path d="M347 149h25m-8-8 8 8-8 8"/><path d="M704 149h25m-8-8 8 8-8 8"/></g></g></svg>
