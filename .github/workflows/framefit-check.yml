name: FrameFit checks
on:
  pull_request:
    paths: ['plugins/framefit/**', '.github/workflows/framefit*.yml']
  push:
    branches: [main]
    paths: ['plugins/framefit/**', '.github/workflows/framefit*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r plugins/framefit/requirements-build.txt
      - name: Download pinned test media tools
        shell: pwsh
        run: |
          $dep = Get-Content plugins/framefit/tools/media-dependency.json -Raw | ConvertFrom-Json
          Invoke-WebRequest $dep.url -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $dep.sha256) { throw 'FFmpeg checksum mismatch' }
          Expand-Archive ffmpeg.zip media
          "FRAMEFIT_BIN_DIR=$((Get-ChildItem media -Recurse -Filter ffmpeg.exe).DirectoryName)" >> $env:GITHUB_ENV
      - run: python -m pytest plugins/framefit/tests -q
      - name: Test panel bridge contract
        run: node --test plugins/framefit/tests/panel_contract.test.mjs
      - name: Parse Windows bootstrap
        shell: powershell
        run: |
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path plugins/framefit/bootstrap.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
