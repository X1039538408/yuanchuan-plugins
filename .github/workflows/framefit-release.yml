name: FrameFit Windows release
on:
  push:
    tags: ['framefit-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (for example 1.0.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: framefit-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: plugins/framefit/requirements-build.txt
      - name: Resolve release version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (-not $version) { $version = $env:GITHUB_REF_NAME -replace '^framefit-v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid FrameFit version' }
          "FRAMEFIT_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install pinned build tools
        run: python -m pip install -r plugins/framefit/requirements-build.txt
      - name: Download verified FFmpeg distribution
        shell: pwsh
        run: |
          $dependency = Get-Content plugins/framefit/tools/media-dependency.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $dependency.url -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $dependency.sha256) { throw 'FFmpeg checksum mismatch' }
          Expand-Archive -LiteralPath ffmpeg.zip -DestinationPath media
          $mediaBin = (Get-ChildItem media -Recurse -Filter ffmpeg.exe).DirectoryName
          "FRAMEFIT_BIN_DIR=$mediaBin" >> $env:GITHUB_ENV
      - name: Test source and updater
        run: python -m pytest plugins/framefit/tests -q
      - name: Test panel bridge contract
        run: node --test plugins/framefit/tests/panel_contract.test.mjs
      - name: Build portable runtime
        run: python plugins/framefit/tools/build_release.py --version ${{ env.FRAMEFIT_VERSION }} --ffmpeg-dir media --output framefit-dist
      - name: Exercise portable MCP and detached export without Python or Node on PATH
        run: python plugins/framefit/tools/portable_smoke.py --archive framefit-dist/framefit-${{ env.FRAMEFIT_VERSION }}-windows-x64.zip
      - name: Upload immutable release then propose stable activation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "framefit-v$env:FRAMEFIT_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; publish a new version instead of replacing binaries' }
          @"
          FrameFit $env:FRAMEFIT_VERSION — Windows x64 portable runtime.

          The runtime becomes the stable channel only after the activation pull request is reviewed and merged.
          Includes third-party license and distribution source information under licenses/.
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create $tag framefit-dist/* --title "FrameFit $env:FRAMEFIT_VERSION" --notes-file release-notes.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          # Keep repository policy: channel activation is reviewed through a PR.
          git fetch origin main
          git switch --create "codex/framefit-channel-$env:FRAMEFIT_VERSION" origin/main
          python plugins/framefit/tools/publish_channel.py --manifest framefit-dist/stable.json
          if ($LASTEXITCODE -ne 0) { throw 'Channel validation failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/framefit/channels/stable.json
          git commit -m "Release FrameFit $env:FRAMEFIT_VERSION to stable"
          if ($LASTEXITCODE -ne 0) { throw 'Channel commit failed' }
          git push origin "codex/framefit-channel-$env:FRAMEFIT_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Channel branch push failed' }
          @"
          Activate the already-uploaded FrameFit $env:FRAMEFIT_VERSION portable release.

          Validation: Windows source/updater tests, panel bridge contract, pinned FFmpeg checksum, portable build, frozen MCP handshake, preview and detached audio/video export with Python and Node removed from PATH, and immutable runtime inventory.
          The SHA-256 manifest changes only after these checks pass. Existing jobs retain their original runtime version.
          "@ | Set-Content -LiteralPath channel-pr.md -Encoding utf8
          gh pr create --base main --head "codex/framefit-channel-$env:FRAMEFIT_VERSION" --title "Release FrameFit $env:FRAMEFIT_VERSION to stable" --body-file channel-pr.md
          if ($LASTEXITCODE -ne 0) { throw 'Channel PR creation failed. Enable Actions pull-request creation or open the pushed branch manually.' }
