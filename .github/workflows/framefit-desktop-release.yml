name: FrameFit Windows desktop release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop version (for example 1.2.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: framefit-desktop-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: plugins/framefit/desktop/requirements-build.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:REQUESTED_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid desktop version' }
          "FRAMEFIT_DESKTOP_VERSION=$env:REQUESTED_VERSION" >> $env:GITHUB_ENV
      - name: Install desktop packaging dependencies
        run: python -m pip install -r plugins/framefit/desktop/requirements-build.txt pytest
      - name: Download and verify FFmpeg distribution
        shell: pwsh
        run: |
          $dependency = Get-Content plugins/framefit/tools/media-dependency.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $dependency.url -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $dependency.sha256) { throw 'FFmpeg checksum mismatch' }
          Expand-Archive -LiteralPath ffmpeg.zip -DestinationPath media
          $mediaBin = (Get-ChildItem media -Recurse -Filter ffmpeg.exe).DirectoryName
          "FRAMEFIT_BIN_DIR=$mediaBin" >> $env:GITHUB_ENV
      - name: Run FrameFit tests
        run: python -m pytest plugins/framefit/tests -q
      - name: Check Codex panel contract
        run: node --test plugins/framefit/tests/panel_contract.test.mjs
      - name: Build portable desktop and updater packages
        run: python plugins/framefit/tools/build_desktop.py --version ${{ env.FRAMEFIT_DESKTOP_VERSION }} --media-dir "$env:FRAMEFIT_BIN_DIR" --output framefit-desktop-dist
      - name: Upload immutable desktop release and open stable-channel PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "framefit-desktop-v$env:FRAMEFIT_DESKTOP_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Desktop releases are immutable; choose a new version' }
          @"
          FrameFit $env:FRAMEFIT_DESKTOP_VERSION — Windows x64 portable desktop software.

          Download framefit-install-* for first installation. Existing installations use the checksummed framefit-desktop-* update package after the user clicks Update.
          Personal settings, project maps, videos and task logs are stored locally and are not included.
          Third-party notices are included under licenses/.
          "@ | Set-Content -LiteralPath desktop-release-notes.md -Encoding utf8
          gh release create $tag framefit-desktop-dist/* --title "FrameFit desktop $env:FRAMEFIT_DESKTOP_VERSION" --notes-file desktop-release-notes.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Desktop release upload failed' }
          git fetch origin main
          git switch --create "codex/framefit-desktop-channel-$env:FRAMEFIT_DESKTOP_VERSION" origin/main
          Copy-Item -LiteralPath framefit-desktop-dist/stable.json -Destination plugins/framefit/desktop/channels/stable.json -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/framefit/desktop/channels/stable.json
          git commit -m "Release FrameFit desktop $env:FRAMEFIT_DESKTOP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Stable manifest commit failed' }
          git push origin "codex/framefit-desktop-channel-$env:FRAMEFIT_DESKTOP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Stable manifest branch push failed' }
          @"
          Activate FrameFit desktop $env:FRAMEFIT_DESKTOP_VERSION after verifying the immutable GitHub Release.

          The release contains the Windows desktop app, MCP host, detached worker, FFmpeg, license notices and a SHA-256 protected update archive. The stable manifest is intentionally changed only after the release is uploaded and its build/test steps pass.
          "@ | Set-Content -LiteralPath desktop-channel-pr.md -Encoding utf8
          gh pr create --base main --head "codex/framefit-desktop-channel-$env:FRAMEFIT_DESKTOP_VERSION" --title "Release FrameFit desktop $env:FRAMEFIT_DESKTOP_VERSION" --body-file desktop-channel-pr.md
          if ($LASTEXITCODE -ne 0) { throw 'Stable channel PR creation failed; open the pushed branch manually if Actions cannot create pull requests.' }
