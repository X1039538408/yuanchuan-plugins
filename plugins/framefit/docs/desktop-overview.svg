<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FrameFit 本地软件操作示意图</title><desc id="desc">左侧为预览、时间轴、缩略图和队列，右侧为模板、适配、项目目录和批量配方设置。</desc>
  <defs><style>.bg{fill:#11181d}.panel{fill:#1b252c}.line{stroke:#3a4b54;stroke-width:2}.txt{fill:#edf3f2;font:18px 'Microsoft YaHei UI',sans-serif}.muted{fill:#a8b7be;font:14px 'Microsoft YaHei UI',sans-serif}.head{fill:#7ee2c4;font:bold 22px 'Microsoft YaHei UI',sans-serif}.call{fill:#7ee2c4;stroke:#11181d;stroke-width:4}.num{fill:#10201c;font:bold 20px sans-serif}</style></defs>
  <rect class="bg" width="1200" height="760" rx="22"/><rect x="20" y="20" width="1160" height="62" rx="12" class="panel"/>
  <text x="48" y="60" class="head">视频套版 FrameFit</text><text x="905" y="58" class="muted">本机处理 · 共享设置入口</text><rect x="1014" y="34" width="138" height="34" rx="8" fill="#294139"/><text x="1041" y="57" class="muted">检查更新</text>
  <rect x="28" y="104" width="760" height="622" rx="16" class="panel"/><rect x="810" y="104" width="362" height="622" rx="16" class="panel"/>
  <text x="52" y="143" class="head">预览与队列</text><rect x="52" y="164" width="710" height="270" rx="10" fill="#081216"/>
  <rect x="262" y="164" width="290" height="270" fill="#197d89"/><rect x="262" y="174" width="290" height="64" fill="#258f9a"/><text x="333" y="214" fill="#ffe39a" font="bold 24px sans-serif">品牌套版</text><rect x="278" y="250" width="258" height="146" rx="5" fill="#d89a73"/><circle cx="408" cy="313" r="44" fill="#e9c58c"/><rect x="278" y="403" width="258" height="24" fill="#258f9a"/>
  <line x1="64" y1="460" x2="746" y2="460" stroke="#7ee2c4" stroke-width="6" stroke-linecap="round"/><circle cx="283" cy="460" r="11" fill="#fff"/><text x="53" y="489" class="muted">拖动时间轴定位，松开后刷新精确预览</text>
  <g><rect x="52" y="505" width="112" height="70" rx="6" fill="#53636a"/><rect x="170" y="505" width="112" height="70" rx="6" fill="#876b57"/><rect x="288" y="505" width="112" height="70" rx="6" fill="#376c76"/><rect x="406" y="505" width="112" height="70" rx="6" fill="#745b53"/><rect x="524" y="505" width="112" height="70" rx="6" fill="#417779"/><text x="57" y="596" class="muted">开头</text><text x="184" y="596" class="muted">缩略图可点击跳转</text><text x="602" y="596" class="muted">结尾</text></g>
  <rect x="52" y="613" width="710" height="78" rx="8" fill="#26343d"/><text x="70" y="644" class="txt">视频队列　v968 1920X1080 V5.mp4</text><text x="70" y="674" class="muted">待导出　·　可多选；键盘 Delete 移除</text>
  <text x="834" y="143" class="head">本机设置</text><text x="834" y="181" class="txt">01  模板与窗口</text><text x="850" y="210" class="muted">自动识别 / 手动坐标 / 适配 / 缩放</text><text x="834" y="252" class="txt">02  输出设置</text><text x="850" y="281" class="muted">尺寸 · 画质 · GPU 或 CPU</text><text x="834" y="323" class="txt">03  项目匹配（每台电脑各自配置）</text><text x="850" y="352" class="muted">排期根目录 · 本机套版根目录</text><text x="850" y="375" class="muted">关键词 · 唯一匹配自动使用</text><text x="834" y="417" class="txt">04  命名和分类</text><text x="850" y="446" class="muted">语言 · 精简 / 完整命名 · 输出目录</text><text x="834" y="488" class="txt">05  批量任务配方</text><text x="850" y="517" class="muted">保存模板、窗口、适配、画质、命名</text><rect x="834" y="556" width="300" height="74" rx="10" fill="#294139"/><text x="854" y="587" class="txt">导出前核对数量与去向</text><text x="854" y="613" class="muted">新增黑白边需要先选择处理方式</text>
